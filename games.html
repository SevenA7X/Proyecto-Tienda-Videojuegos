<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Games - Juegos</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar"></div>

    <!-- Los productos se cargarán aquí mediante JavaScript --> 
    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1>Juegos</h1>
            <span id="cantidadJuegos" class="badge text-bg-secondary"></span>
        </div>
        <div class="row mb-4">
    <div class="col-md-6 mb-3 mb-md-0">
        <input type="text" id="buscadorNombre" class="form-control" placeholder="Buscar juego por nombre...">
    </div>
    <div class="col-md-6">
        <select id="filtroConsola" class="form-select">
            <option value="Todas">Todas las consolas</option>
            <option value="Nintendo Switch 2">Nintendo Switch 2</option>
            <option value="PlayStation 5">PlayStation 5</option>
            <option value="XBOX ONE">XBOX ONE</option>
        </select>
    </div>
</div>
        <div id="contenedorJuegos" class="row g-4"></div>
    </main>
    
  <div id="footer" class="mt-auto w-100"></div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous"></script>
    <script src="js/app.js"></script> 
    <script src="js/games.js"></script>  
</body>
</html>
