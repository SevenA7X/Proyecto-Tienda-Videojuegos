<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Games - Contacto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar"></div>

    <main class="container my-5 text-dark">
        <section>
            <!-- Agregamos 'novalidate' y un ID al formulario -->
<form id="formularioContacto" class="needs-validation" novalidate>
    
    <div class="mb-3 text-start">
        <label for="correo" class="form-label fw-bold">Correo electrónico</label>
        <input type="email" class="form-control" id="correo" placeholder="nombre@ejemplo.com" required>
        <div class="invalid-feedback">
            Por favor, complete este campo con un correo válido.
        </div>
    </div>

    <div class="mb-3 text-start">
        <label for="asunto" class="form-label fw-bold">Asunto</label>
        <input type="text" class="form-control" id="asunto" placeholder="¿En qué podemos ayudarte?" required>
        <div class="invalid-feedback">
            El asunto es obligatorio, por favor complételo.
        </div>
    </div>

    <div class="mb-3 text-start">
        <label for="mensaje" class="form-label fw-bold">Mensaje</label>
        <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu mensaje aquí..." required></textarea>
        <div class="invalid-feedback">
            No olvide escribir su mensaje.
        </div>
    </div>

    <button type="submit" class="btn btn-login w-100 mt-3">Enviar mensaje</button>
</form>
        </section>
    </main>

    <!-- Footer estructurado con clases de Bootstrap -->
    <div id="footer" class="mt-auto w-100"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
    <script src="js/validacion.js"></script>
</body>
</html>
