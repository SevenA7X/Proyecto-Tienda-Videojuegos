<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Games - Contacto</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar"></div>

    <main class="container my-5 text-dark">
        <section>
            <h2 class="text-center mb-4">Formulario de Contacto</h2>
            
            <div class="row">
                <div class="col-lg-6 col-md-8 mx-auto">
                    <form action="#" method="post">
                        <div class="mb-3">
                            <label for="nombre" class="form-label">Nombre Completo:</label>
                            <input type="text" id="nombre" name="nombre" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="email" class="form-label">Correo Electrónico:</label>
                            <input type="email" id="email" name="email" class="form-control" required>
                        </div>
                        
                        <div class="mb-3">
                            <label for="mensaje" class="form-label">Consulta:</label>
                            <textarea id="mensaje" name="mensaje" rows="4" class="form-control" required></textarea>
                        </div>
                        
                        <button type="submit" class="btn-login w-100">Enviar</button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <!-- Footer estructurado con clases de Bootstrap -->
    <div id="footer" class="mt-auto w-100"></div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
</body>
</html>
