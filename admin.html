<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Games - Panel Administrativo</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
    
    <script>
        const sesion = JSON.parse(localStorage.getItem("sesionActiva"));
        
        if (!sesion || sesion.rol !== "Administrador") {
            alert("Acceso denegado. Solo el Administrador puede ingresar a esta área reservada, Leafy-sama.");
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div id="navbar"></div>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="fw-bold">Panel Administrativo Centralizado</h1>
            <button class="btn btn-danger fw-bold shadow-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
        </div>

        <div class="alert alert-success shadow-sm mb-5" role="alert">
            <h4 class="alert-heading">¡Bienvenido de vuelta!</h4>
            <p class="mb-0">Tu identidad ha sido verificada. Tienes control total sobre el catálogo de tu tienda.</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card border-0 shadow-sm h-100">
                    <div class="card-body p-5 text-center d-flex flex-column justify-content-center">
                        <h3 class="card-title fw-bold text-primary mb-3">Gestión de Inventario y Stock</h3>
                        <p class="text-muted fs-5 mb-4">Módulo CRUD para crear, editar, visualizar y eliminar videojuegos del catálogo.</p>
                        <button class="btn btn-dark w-100 py-3 fw-bold fs-5 shadow-sm">Administrar Catálogo</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer" class="mt-auto w-100"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/app.js"></script> 
    <script>
        function cerrarSesion() {
            localStorage.removeItem("sesionActiva")
            window.location.href = "login.html";
        }
    </script>
</body>
</html>
