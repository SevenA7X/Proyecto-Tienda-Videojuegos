<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Games - Carrito</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar"></div>

    <main class="container py-5 carrito-container">
        <h2 class="mb-4 fw-bold" id="tituloCarrito">Tu carrito de compra</h2>

        <div class="row">

            <div class="col-lg-8 mb-4">
                <div id="contenedorCarrito">
                </div>

                <div class="d-flex justify-content-between align-items-center mt-3" id="controlesInferiores">
                    <div>
                        <a href="games.html" class="btn btn-secundario me-2">Seguir comprando</a>
                        <button class="btn btn-comprar" id="btnContinuarInferior">Continuar con el pago</button>
                    </div>
                    <span class="link-sutil" id="btnVaciar" style="display: none;">Eliminar todos los artículos</span>
                </div>
            </div>

            <div class="col-lg-4">
                <div class="resumen-caja sticky-top" style="top: 20px;">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <span class="fs-6 fw-bold">Total estimado</span>
                        <span class="fs-5 fw-bold" id="totalCarrito">CLP$0</span>
                    </div>

                    <button class="btn btn-comprar w-100 mt-2" id="btnComprar">Continuar con el pago</button>
                </div>
            </div>
        </div>
    </main>
   
    <div id="footer" class="mt-auto w-100"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous"></script>
    <script src="js/app.js"></script>
    <script src="js/carrito.js"></script>  
</body>
</html>
