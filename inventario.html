<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Games - Gestión de Inventario</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
    
    <script>
        const sesion = JSON.parse(localStorage.getItem("sesionActiva"));
        if (!sesion || sesion.rol !== "Administrador") {
            alert("Acceso denegado. Solo el Administrador puede ingresar a esta área reservada.");
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="d-flex flex-column min-vh-100 bg-light">
    <div id="navbar"></div>

    <main class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Gestión de Catálogo</h2>
            <a href="admin.html" class="btn btn-secondary fw-bold shadow-sm">Volver al Panel</a>
        </div>

        <div id="alertasInventario"></div>

        <div class="row">
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm border-0">
                    <div class="card-header bg-dark text-white fw-bold">
                        <span id="tituloFormulario">Agregar Nuevo Juego</span>
                    </div>
                    <div class="card-body">
                        <form id="formularioInventario" class="needs-validation" novalidate>
                            <input type="hidden" id="juegoId">
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Nombre</label>
                                <input type="text" class="form-control" id="nombreJuego" required>
                            </div>
                            
                            <div class="mb-3">
                                <label class="form-label fw-bold">Consola</label>
                                <select class="form-select" id="consolaJuego" required>
                                    <option value="" disabled selected>Seleccione...</option>
                                    <option value="Nintendo Switch 2">Nintendo Switch 2</option>
                                    <option value="PlayStation 5">PlayStation 5</option>
                                    <option value="XBOX ONE">XBOX ONE</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Precio (CLP)</label>
                                <input type="number" class="form-control" id="precioJuego" min="1" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Stock</label>
                                <input type="number" class="form-control" id="stockJuego" min="0" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">URL de Imagen</label>
                                <input type="url" class="form-control" id="imagenJuego" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label fw-bold">Descripción</label>
                                <textarea class="form-control" id="descripcionJuego" rows="3" required></textarea>
                            </div>

                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-success w-100 fw-bold" id="btnGuardar">Guardar</button>
                                <button type="button" class="btn btn-secondary w-100 fw-bold d-none" id="btnCancelar" onclick="resetearFormulario()">Cancelar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>

            <div class="col-lg-8">
                <div class="card shadow-sm border-0">
                    <div class="card-body p-0">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle mb-0 text-center">
                                <thead class="table-dark">
                                    <tr>
                                        <th>ID</th>
                                        <th>Juego</th>
                                        <th>Consola</th>
                                        <th>Precio</th>
                                        <th>Stock</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaInventario">
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div id="footer" class="mt-auto w-100"></div>

    <!-- LIBRERÍAS Y SCRIPTS FINALES -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="js/app.js"></script> 
    <script src="js/inventario.js"></script>
</body>
</html>
