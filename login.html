<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quark Games - Login</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body class="d-flex flex-column min-vh-100">
    <div id="navbar"></div>

    <div class="container mt-5">
        <h2 class="text-center mb-4">Iniciar Sesión</h2>
        <div class="row justify-content-center">
            <div class="col-md-6">
            <form id="formularioContacto" class="needs-validation" novalidate>
            <div class="mb-3 text-start">
                <label for="correo" class="form-label fw-bold">Correo electrónico</label>
                <input type="email" class="form-control" id="correo" placeholder="ejemplo@correo.cl" required>
                <div class="invalid-feedback">
                   Por favor, complete este campo con un correo válido.
                </div>
            </div>
                <div class="mb-3 text-start">
            <label for="password" class="form-label fw-bold">Contraseña</label>
            <input type="password" class="form-control" id="password" placeholder="Ingresa aqui tu contraseña..." required>
            <div class="invalid-feedback">
                Por favor, complete este campo con su contraseña.
                </div>
            </div>
                    <button type="submit" class="btn-login w-100">Iniciar Sesión</button>
                
                    <div class="text-center mt-2">
                        <span class="text-muted">Correo: ejemplo@correo.cl | Contraseña: 123456</span>
                    </div>

                    <div class="text-center">
                        <span class="small text-muted">¿No tienes cuenta?</span> 
                        <a href="register.html" class="register-link small ms-1">Regístrate aquí</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
    <div id="footer" class="mt-auto w-100"></div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-YvpcrYf0tY3lHB60NNkmxc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" 
    crossorigin="anonymous"></script>
    <script src="js/app.js"></script>  
    <script src="js/validacion.js"></script>
</body>
</html>
